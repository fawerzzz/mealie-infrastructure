name: CI
on: [push]
jobs:
  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - name: Helm lint
        run: helm lint ./helm-chart
  validate-manifests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - name: Set up Yamllint
        run: sudo apt-get update && sudo apt-get install -y yamllint
      - name: Set up Kubeconform
        run: |
          curl -L https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz -o kubeconform.tar.gz
          tar xf kubeconform.tar.gz
          sudo mv kubeconform /usr/local/bin/
          rm kubeconform.tar.gz
      - name: Helm template
        run: helm template mealie ./helm-chart > rendered.yaml
      - name: Yamllint
        run: yamllint rendered.yaml
      - name: Kubeconform
        run: kubeconform rendered.yaml

